name: Release (Self-contained binaries)

# Publica ejecutables autónomos para todas las plataformas cuando se empuja un
# tag de versión (p. ej. git tag v1.0.0 && git push origin v1.0.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necesario para crear la Release y subir adjuntos

jobs:
  release:
    name: Build & publish binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build self-contained binaries (all platforms)
        run: |
          chmod +x scripts/publish.sh
          ./scripts/publish.sh osx-arm64 osx-x64 win-x64 linux-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.zip
          generate_release_notes: true
